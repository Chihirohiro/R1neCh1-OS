function previewWishImage(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{document.getElementById('wishImageData').value=r.result;const p=document.getElementById('wishPreview');const b=document.getElementById('wishPreviewBox');if(p)p.src=r.result;else if(b)b.outerHTML=`<img id="wishPreview" class="preview" src="${r.result}">`};r.readAsDataURL(f)} function saveWish(){const id=$('#wishId').value,n=$('#wishName').value.trim();if(!n)return;const obj={id:id||uid(),name:n,price:Number($('#wishPrice').value||0),note:$('#wishNote').value.trim(),image:$('#wishImageData').value||''};if(id){const i=data.wishes.findIndex(x=>x.id===id);data.wishes[i]=obj}else data.wishes.push(obj);save();closeSheet()} function deleteWish(id){data.wishes=data.wishes.filter(x=>x.id!==id);save();closeSheet()}
function nthWeekday(y,m,weekday,n){const d=new Date(y,m-1,1),offset=(7+weekday-d.getDay())%7;return 1+offset+7*(n-1)}
function jpHolidayBase(y,m,d){const k=`${m}-${d}`;if(['1-1','2-11','2-23','4-29','5-3','5-4','5-5','8-11','11-3','11-23'].includes(k))return true;if(m===1&&d===nthWeekday(y,1,1,2))return true;if(m===7&&d===nthWeekday(y,7,1,3))return true;if(m===9&&d===nthWeekday(y,9,1,3))return true;if(m===10&&d===nthWeekday(y,10,1,2))return true;const ve=Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4)),ae=Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4));if(m===3&&d===ve)return true;if(m===9&&d===ae)return true;return false}
function isJpHoliday(y,m,d){if(jpHolidayBase(y,m,d))return true;const cur=new Date(y,m-1,d);if(cur.getDay()!==0){let prev=new Date(cur);prev.setDate(prev.getDate()-1);while(prev.getDay()===0)prev.setDate(prev.getDate()-1);if(jpHolidayBase(prev.getFullYear(),prev.getMonth()+1,prev.getDate())){const base=new Date(prev);base.setDate(base.getDate()+1);while(base.getDay()===0)base.setDate(base.getDate()+1);if(base.toDateString()===cur.toDateString())return true}}const a=new Date(cur);a.setDate(a.getDate()-1);const b=new Date(cur);b.setDate(b.getDate()+1);if(a.getDay()!==0&&b.getDay()!==0&&jpHolidayBase(a.getFullYear(),a.getMonth()+1,a.getDate())&&jpHolidayBase(b.getFullYear(),b.getMonth()+1,b.getDate()))return true;return false}
let calCursor=new Date();calCursor.setDate(1);function renderCalendar(){const y=calCursor.getFullYear(),m=calCursor.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),periodPred=predictedPeriodDays();let cells='';for(let i=0;i<first.getDay();i++)cells+='<div class="daycell"></div>';for(let day=1;day<=last.getDate();day++){const k=`${y}-${pad(m+1)}-${pad(day)}`,es=eventsOn(k),d=diaryFor(k),hasDiary=(d.memos?.length||d.song||d.specialDay),wd=new Date(y,m,day).getDay(),holiday=isJpHoliday(y,m+1,day),dayClass=holiday?'holiday':wd===0?'sun':wd===6?'sat':'';cells+=`<div class="daycell ${dayClass} ${k===todayKey()?'today':''}" onclick="showDay('${k}')"><div class="daynum">${day}</div>${periodPred.has(k)?'<span class="period-moon">☾</span>':''}${hasDiary?'<span class="cal-journal">✦</span>':''}${es.slice(0,3).map(e=>`<div class="cal-event ${e.type==='work'?(e.title==='時短バイト'?'work-short':'work-normal'):e.type==='out'?'pink':e.type?.startsWith('trash')?'green':''} ${e.important?'important':''}">${e.important?'☆ ':''}${esc(e.title)}</div>`).join('')}${es.length>3?`<div class="cal-more">+${es.length-3}件</div>`:''}</div>`}$('#calendarPage').innerHTML=`<div class="card calendar-wrap"><div class="cal-head"><button class="btn ghost" onclick="calMove(-1)">‹</button><b>${y}年 ${m+1}月</b><button class="btn ghost" onclick="calMove(1)">›</button></div><div class="cal-grid">${'日月火水木金土'.split('').map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div><div class="tiny muted" style="margin-top:8px">✦ = 日記・一曲・「今日は何の日？」の記録あり　☾ = 生理予測</div></div>`}
function calMove(n){calCursor.setMonth(calCursor.getMonth()+n);renderCalendar()} function showDay(k){const es=eventsOn(k),d=diaryFor(k),ws=data.weights.filter(x=>x.date===k),ms=data.meals.filter(x=>x.date===k),hasRecord=!!(d.specialDay||d.song||d.memos?.length);openSheet(`<h3>${fmtDate(k)}</h3><div class="period-note"><div class="between"><span>${isPeriodStart(k)?'🌙 生理開始日として登録済み':'☾ 生理が始まった日なら登録'}</span><button class="pill" onclick="togglePeriodStart('${k}')">${isPeriodStart(k)?'解除':'登録'}</button></div></div>${specialAutoHtml(k)}${d.specialDay?`<div class="special-day-badge"><div class="between"><b>☆ 今日は何の日？</b><button class="pill" onclick="openDayRecord('${k}')">✎</button></div>${esc(d.specialDay)}</div>`:''}${es.length?`<div class="label">予定</div>${es.map(e=>eventRow(e,true)).join('')}`:''}${d.song?`<div class="between" style="margin-top:12px"><div class="label" style="margin:0">この日の一曲</div><button class="pill" onclick="openDayRecord('${k}')">✎</button></div><div class="song-badge"><b>♪ ${esc(d.song.title)}</b> ${esc(d.song.artist||'')}</div>`:''}${d.memos?.length?`<div class="label" style="margin-top:12px">日記</div>${d.memos.map(m=>`<div class="journal-entry"><button class="pill journal-edit-float" onclick="openEditMemo('${k}','${m.id}')">✎</button>${m.time?`<div class="tiny muted journal-time">${m.time}</div>`:''}<div class="journal-body">${esc(m.text)}</div><div>${(m.tags||[]).map(t=>`<span class="tagchip pink">#${esc(t)}</span>`).join('')}</div></div>`).join('')}`:''}${ws.length?`<div class="label" style="margin-top:12px">体重</div>${ws.map(w=>`<div class="small">${w.time}　<b>${w.value}kg</b> ${esc(w.note||'')}</div>`).join('')}`:''}${ms.length?`<div class="label" style="margin-top:12px">食事</div>${ms.map(m=>`<div class="small">${m.time}　${esc(m.menu)} ${m.kcal?m.kcal+'kcal':''}</div>`).join('')}`:''}${!es.length&&!hasRecord&&!ws.length&&!ms.length?'<div class="muted small">この日はまだ何もなし。</div>':''}<div class="sheet-actions" style="margin-top:14px"><button class="btn let prepTimerStartedAt=null;
function prepSession(){return data.prepState}
function prepStepMs(){const p=prepSession();return p.sessionStartedAt&&p.stepStartedAt?Math.max(0,(p.sessionFinishedAt||p.pausedAt||Date.now())-p.stepStartedAt-(p.stepPausedMs||0)):0}
function prepTotalMs(){const p=prepSession();return p.sessionStartedAt?Math.max(0,(p.sessionFinishedAt||p.pausedAt||Date.now())-p.sessionStartedAt-(p.totalPausedMs||0)):0}
function ensurePrepSession(){const p=prepSession();if(!p.sessionStartedAt){p.sessionStartedAt=Date.now();p.stepStartedAt=p.sessionStartedAt;p.sessionFinishedAt=null;p.sessionTemplateId=activePrep().id;p.pausedAt=null;p.totalPausedMs=0;p.stepPausedMs=0;localStorage.setItem(LS,JSON.stringify(data))}}
function clearPrepSession(){const p=prepSession();p.sessionStartedAt=null;p.stepStartedAt=null;p.sessionFinishedAt=null;p.sessionTemplateId=null;p.pausedAt=null;p.totalPausedMs=0;p.stepPausedMs=0}
function recordPrepTotal(tpl,ms){if(ms<500)return;data.prepTotalStats=data.prepTotalStats||{};const st=data.prepTotalStats[tpl.id]||{count:0,totalMs:0,minMs:null,maxMs:null,lastMs:null};st.count++;st.totalMs+=ms;st.minMs=st.minMs==null?ms:Math.min(st.minMs,ms);st.maxMs=st.maxMs==null?ms:Math.max(st.maxMs,ms);st.lastMs=ms;data.prepTotalStats[tpl.id]=st}
function prepStat(stepId){return data.prepStats?.[stepId]||null}
function formatDuration(ms){if(ms==null||!isFinite(ms))return'--';const sec=Math.max(0,Math.round(ms/1000));if(sec<60)return sec+'秒';const m=Math.floor(sec/60),s=sec%60;return s?`${m}分${s}秒`:`${m}分`}
function stepAvg(st){return st&&st.count?st.totalMs/st.count:null}
function prepStepStatsHtml(stepId){const st=prepStat(stepId);if(!st||!st.count)return'<span>まだ計測なし</span>';return `<span>実測 ${st.count}回　✦ 最短 ${formatDuration(st.minMs)}　♡ 平均 ${formatDuration(stepAvg(st))}　✧ 最長 ${formatDuration(st.maxMs)}</span>`}
function currentPrepElapsed(){return prepStepMs()}
function formatStopwatch(ms){const total=Math.max(0,Math.floor(ms/1000)),m=Math.floor(total/60),sec=total%60;return `${pad(m)}:${pad(sec)}`}
function startPrepTimer(){}
function recordPrepStep(step){if(!step||!prepSession().sessionStartedAt||prepSession().sessionFinishedAt)return;const ms=prepStepMs();if(ms<500)return;data.prepStats=data.prepStats||{};const st=data.prepStats[step.id]||{count:0,totalMs:0,minMs:null,maxMs:null,lastMs:null};st.count++;st.totalMs+=ms;st.minMs=st.minMs==null?ms:Math.min(st.minMs,ms);st.maxMs=st.maxMs==null?ms:Math.max(st.maxMs,ms);st.lastMs=ms;data.prepStats[step.id]=st}
function togglePrepStopwatch(on){if(on)ensurePrepSession();renderPrep()}
function prepTotals(){const tpl=activePrep(),stats=tpl.steps.map(s=>prepStat(s.id)).filter(st=>st&&st.count);return {measured:stats.length,total:tpl.steps.length,min:stats.reduce((a,st)=>a+(st.minMs||0),0),avg:stats.reduce((a,st)=>a+(stepAvg(st)||0),0),max:stats.reduce((a,st)=>a+(st.maxMs||0),0)}}
function subtractMsFromTime(hhmm,ms){if(!hhmm)return'--:--';const [h,m]=hhmm.split(':').map(Number),d=new Date(2000,0,1,h,m);d.setMilliseconds(d.getMilliseconds()-ms);return `${pad(d.getHours())}:${pad(d.getMinutes())}`}
function prepColorLabel(c){return ({blue:'ブルー',purple:'パープル',pink:'ピンク',yellow:'イエロー',green:'グリーン'})[c]||'ピンク'}
function minutesNow(){const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60}
function hhmmFromMinutes(v){v=((Math.round(v)%1440)+1440)%1440;return `${pad(Math.floor(v/60))}:${pad(v%60)}`}
function avgMinutesForStep(step){const a=stepAvg(prepStat(step.id));return a&&a>0?a/60000:1}
function dynamicPrepTargets(tpl){const out={};if(!tpl.steps.length)return out;const now=minutesNow(),idx=Math.max(0,Math.min(data.prepState.index,tpl.steps.length-1));let goalIndex=tpl.steps.findIndex(x=>x.id===tpl.goalStepId);if(goalIndex<0)goalIndex=tpl.steps.length-1;let goal=tpl.goalTime?tpl.goalTime.split(':').map(Number):null;let goalMin=goal?goal[0]*60+goal[1]:null;if(goalMin!=null&&goalMin<now-60)goalMin+=1440;
 const assign=(from,to,start,end)=>{if(to<from)return;const weights=[];for(let j=from;j<=to;j++)weights.push(avgMinutesForStep(tpl.steps[j]));const total=weights.reduce((a,b)=>a+b,0)||weights.length;let cur=start;for(let j=from;j<=to;j++){const dur=(end-start)*(weights[j-from]/total);cur+=dur;out[tpl.steps[j].id]=hhmmFromMinutes(cur)}};
 if(goalMin!=null&&idx<=goalIndex){assign(idx,goalIndex,now,goalMin);let cur=goalMin;for(let j=goalIndex+1;j<tpl.steps.length;j++){cur+=avgMinutesForStep(tpl.steps[j]);out[tpl.steps[j].id]=hhmmFromMinutes(cur)}}else{let cur=now;for(let j=idx;j<tpl.steps.length;j++){cur+=avgMinutesForStep(tpl.steps[j]);out[tpl.steps[j].id]=hhmmFromMinutes(cur)}}return out}
function renderPrep(){const tpl=activePrep();data.prepState.index=Math.max(0,Math.min(data.prepState.index,Math.max(0,tpl.steps.length-1)));const i=data.prepState.index,step=tpl.steps[i],next=tpl.steps[i+1],targets=dynamicPrepTargets(tpl);$('#prepPage').innerHTML=`<div class="prep-page prep-${tpl.color||'pink'}"><div class="between"><select style="width:auto;border:0;background:transparent;font-weight:850" onchange="changePrepTemplate(this.value)">${data.prepTemplates.map(t=>`<option value="${t.id}" ${t.id===tpl.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select><div style="display:flex;gap:6px"><button class="pill" onclick="openNewPrepTemplate()" title="モード追加" aria-label="モード追加">➕</button><button class="pill" onclick="openPrepHelp()" title="ヘルプ" aria-label="ヘルプ">❔</button><button class="pill" onclick="openPrepStats()" title="記録" aria-label="記録">⏱️</button><button class="pill" onclick="openPrepSettings()" title="工程編集" aria-label="工程編集">✒️</button></div></div><div class="prep-clock" id="prepClock">${timeNow()}</div><div class="prep-meta">${tpl.goalTime?'ゴール '+tpl.goalTime:'ゴール未設定'} ・ STEP ${tpl.steps.length?i+1:0}/${tpl.steps.length}</div>${step?`<div class="prep-now"><div class="prep-task">${esc(step.text)}</div>${targets[step.id]?`<div class="prep-target">目安完了 ${targets[step.id]}</div>`:''}<div class="prep-auto-watch"><div class="prep-auto-label">工程の経過時間</div><div class="prep-timer-controls"><button class="btn ghost" onclick="prepWatchStart()">▶️ ${prepSession().pausedAt?"再開":prepSession().sessionStartedAt?"計測中":"開始"}</button><button class="btn ghost" onclick="prepWatchPause()">⏸️ 一時停止</button><button class="btn ghost" onclick="prepWatchResume()">⏹️ 停止</button></div><div class="watch-time" id="prepWatchTime">${formatStopwatch(prepStepMs())}</div><div class="prep-auto-total">準備全体 <b id="prepTotalTime">${formatStopwatch(prepTotalMs())}</b></div><div class="step-stats">${prepStepStatsHtml(step.id)}</div></div><button class="big-tap" onclick="prepNext()">できた！ 次へ</button>${next?`<div class="prep-next">次：${esc(next.text)} ${targets[next.id]?'・'+targets[next.id]+'目安':''}</div>`:''}<div class="prep-actions"><button class="btn ghost" onclick="prepBack()">↩ ひとつ戻る</button><button class="btn ghost" onclick="prepReset()">🔄 最初から</button></div></div>`:'<div class="card">工程がありません。「工程編集」から追加してね。</div>'}</div>`;startClock()}
function openPrepHelp(){openSheet('<h3>準備モードの使い方</h3><p>▶️で計測を開始。次へ進むと工程時間は0に戻り、全体時間は最後まで計測します。</p><p>最後の工程を終えると全体の所要時間を保存します。</p><button class="btn ghost" onclick="closeSheet()">閉じる</button>')}

function prepWatchPause(){const p=prepSession();if(p.sessionStartedAt&&!p.pausedAt&&!p.sessionFinishedAt){p.pausedAt=Date.now();save()}}

function prepNext(){const t=activePrep(),p=prepSession(),step=t.steps[p.index],isLast=p.index>=t.steps.length-1;if(p.pausedAt){alert('一時停止中だよ。再開してから進めてね');return}if(p.sessionStartedAt&&!p.sessionFinishedAt)recordPrepStep(step);if(isLast){const ms=prepTotalMs();if(p.sessionStartedAt&&!p.sessionFinishedAt){recordPrepTotal(t,ms);p.sessionFinishedAt=Date.now()}save();alert(p.sessionStartedAt?'準備おつかれさま！ 全体で '+formatDuration(ms)+' かかったよ。':'準備おつかれさま！');}else{p.index+=1;p.stepStartedAt=p.sessionStartedAt&&!p.sessionFinishedAt?Date.now():null;p.stepPausedMs=0;save()}}

function changePrepTemplate(id){data.prepState.templateId=id;data.prepState.index=0;clearPrepSession();save()}
function openPrepStats(){const tpl=activePrep(),tot=prepTotals(),allMeasured=tot.measured===tot.total&&tot.total>0;openSheet(`<h3>⏱ ${esc(tpl.name)} の実測</h3><div class="prep-full-stats">${(()=>{const st=data.prepTotalStats?.[tpl.id];return st?.count?`<b>準備全体の実測（${st.count}回）</b><div>直近 ${formatDuration(st.lastMs)} ／ 最短 ${formatDuration(st.minMs)} ／ 平均 ${formatDuration(st.totalMs/st.count)} ／ 最長 ${formatDuration(st.maxMs)}</div>`:"準備全体の実測はまだないよ"})()}</div><div class="stats-grid"><div class="stat-chip">最短合計<b>${tot.measured?formatDuration(tot.min):'--'}</b></div><div class="stat-chip">平均合計<b>${tot.measured?formatDuration(tot.avg):'--'}</b></div><div class="stat-chip">最長合計<b>${tot.measured?formatDuration(tot.max):'--'}</b></div></div><div class="small muted" style="margin:8px 0 12px;text-align:center">${tot.measured}/${tot.total}工程 計測済み${allMeasured?'':' ・ 合計は計測済み分のみ'}</div>${tpl.leave&&tot.measured?`<div class="card pink" style="margin:0 0 12px"><b>出発 ${tpl.leave} から逆算</b><div class="small" style="margin-top:7px">最短ペース　${subtractMsFromTime(tpl.leave,tot.min)}<br>平均ペース　${subtractMsFromTime(tpl.leave,tot.avg)}<br>最長ペース　${subtractMsFromTime(tpl.leave,tot.max)}</div></div>`:''}<div>${tpl.steps.map((s,i)=>{const st=prepStat(s.id);return `<div class="prep-stats-row"><div class="between"><b>${i+1}. ${esc(s.text)}</b>${st?.count?`<button class="pill" onclick="resetPrepStat('${s.id}')">リセット</button>`:''}</div>${st?.count?`<div class="small muted">${st.count}回　最短 ${formatDuration(st.minMs)} ／ 平均 ${formatDuration(stepAvg(st))} ／ 最長 ${formatDuration(st.maxMs)} ／ 直近 ${formatDuration(st.lastMs)}</div>`:'<div class="small muted">まだ計測なし</div>'}</div>`}).join('')}</div><div class="sheet-actions"><button class="btn ghost" onclick="closeSheet()">閉じる</button></div>`)}

function openPrepSettings(){const tpl=activePrep();openSheet(`<h3>${esc(tpl.name)} の工程編集</h3><div class="label">モード名</div><input id="prepModeName" class="input" maxlength="60" value="${attr(tpl.name)}" placeholder="モード名"><div class="goal-box"><div class="label">ゴール時間</div><input id="prepGoalTime" class="input" type="time" value="${attr(tpl.goalTime||'')}"><div class="tiny muted" style="margin:6px 0 8px">この時刻までに、下で選んだ工程へ到達するよう実測時間を比率配分するよ。</div><div class="label">この工程を始めたい</div><select id="prepGoalStep"><option value="">最後の工程まで</option>${tpl.steps.map(x=>`<option value="${x.id}" ${tpl.goalStepId===x.id?'selected':''}>${esc(x.text)}</option>`).join('')}</select></div><div class="label">背景カラー</div><select id="prepColor">${[['blue','ブルー'],['purple','パープル'],['pink','ピンク'],['yellow','イエロー'],['green','グリーン']].map(([v,n])=>`<option value="${v}" ${tpl.color===v?'selected':''}>${n}</option>`).join('')}</select><div class="small muted" style="margin:12px 0 10px">≡ を押したままドラッグして並べ替え。工程ごとの予定時刻は自動で作るので入力不要。</div><div id="prepEditList">${tpl.steps.map((x,i)=>prepEditRow(x,i)).join('')}</div><div class="form-row"><input id="newStepText" class="input" placeholder="新しい工程"></div><button class="btn ghost" style="width:100%" onclick="addPrepStep()">＋工程を追加</button><div class="sheet-actions"><button class="btn ghost" onclick="deletePrepTemplate()">モード削除</button><button class="btn ghost" onclick="closeSheet()">閉じる</button><button class="btn pink" onclick="savePrepSettings()">保存</button></div>`)}

function parseChapiImport(raw){
 const line=String(raw||'').trim().replace(/[｜]/g,'|');
 if(!line)return {error:'文字列を貼り付けてね'};
 const parts=line.split('|').map(x=>x.trim());
 if(parts.length!==3&&parts.length!==4)return {error:'「56.5 | ハンバーグ | 950」の形で貼り付けてね'};
 let date=todayKey(),fields=parts;
 if(parts.length===4){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(parts[0])||Number.isNaN(new Date(parts[0]+'T12:00:00').getTime()))return {error:'日付は 2026-10-30 の形にしてね'};
  date=parts[0];fields=parts.slice(1);
 }
 const [wRaw,menu,kRaw]=fields;
 const weight=wRaw===''||wRaw==='-'?null:Number(wRaw.replace(/kg/ig,'').trim());
 const kcal=kRaw===''||kRaw==='-'?null:Number(kRaw.replace(/kcal/ig,'').trim());
 if(weight!==null&&(!Number.isFinite(weight)||weight<20||weight>300))return {error:'体重の数値を確認してね'};
 if(kcal!==null&&(!Number.isFinite(kcal)||kcal<0||kcal>20000))return {error:'カロリーの数値を確認してね'};
 if(weight===null&&(!menu||menu==='-'))return {error:'体重か食事のどちらかを入れてね'};
 if(menu&&menu!=='-'&&kcal===null)return {error:'食事がある場合はカロリーを入れてね。わからなければ 0 にしてね'};
 return {date,weight,menu:menu==='-'?'':menu,kcal};
}

}
function previewChapiImport(){
 const result=parseChapiImport($('#chapiPaste')?.value);
 const box=$('#chapiPreview'),btn=$('#chapiSaveBtn');
 if(!box||!btn)return;
 if(result.error){box.textContent=result.error;btn.disabled=true;return}
 const count=(data.weights||[]).filter(w=>w.date===result.date).length;
 const limit=result.weight!==null&&count>=2;
 box.textContent=`${result.date} に登録：`+(result.weight!==null?`体重 ${result.weight.toFixed(1)} kg`:'体重なし')+' ／ '+(result.menu?`食事 ${result.menu}（${result.kcal} kcal）`:'食事なし')+(limit?' ／ この日は体重が2回記録済み':'');
 btn.disabled=limit;
}

 const {date,weight,menu,kcal}=result,time=timeNow();

 if(!confirm(`${date} に体重・食事を登録する？\n${weight!==null?weight+' kg':'体重なし'} / ${menu||'食事なし'}${menu?' / '+kcal+' kcal':''}`))return;
 if(weight!==null)data.weights.push({id:uid(),date,time,value:weight,note:'ちゃぴから入力'});

function openEditEvent(id){const e=data.events.find(x=>x.id===id);if(!e)return;const isWork=e.type==='work';openSheet(`<h3>予定を編集</h3><div class="label">日付</div><input id="eDate" class="input" type="date" value="${attr(e.date||todayKey())}"><div class="label" style="margin-top:9px">予定名</div><input id="eTitle" class="input" value="${attr(e.title||'')}" placeholder="予定名"><div style="height:9px"></div><input id="eTime" class="input" type="time" value="${attr(e.time||'')}"><div style="height:9px"></div><select id="eType" onchange="toggleWorkEditChoice()"><option value="out" ${e.type==='out'?'selected':''}>外出</option><option value="work" ${isWork?'selected':''}>バイト</option><option value="trash" ${e.type==='trash'?'selected':''}>ごみ</option><option value="other" ${e.type==='other'?'selected':''}>その他</option></select><div id="workEditChoice" style="${isWork?'':'display:none'};margin-top:9px"><div class="label">バイト種別</div><select id="eWorkKind"><option value="normal" ${e.title!=='時短バイト'?'selected':''}>バイト（通常）</option><option value="short" ${e.title==='時短バイト'?'selected':''}>時短バイト</option></select></div><label class="important-check"><input id="eImportant" type="checkbox" ${e.important?'checked':''}><span><b>☆ 大事な予定</b><div class="tiny muted">ライブ・現場など</div></span></label><div style="height:12px"></div><div class="label">🎒 持ち物セット</div><select id="eList"><option value="">持ち物セットなし</option>${data.lists.filter(l=>l.cat==='持ち物').map(l=>`<option value="${l.id}" ${e.listId===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select><div class="sheet-actions"><button class="btn ghost" onclick="deleteEvent('${e.id}')" style="color:#d85d79">予定を削除</button><button class="btn ghost" onclick="showDay('${e.date}')">戻る</button><button class="btn primary" onclick="saveEditEvent('${e.id}')">編集を保存</button></div>`) }

function saveEditEvent(id){const e=data.events.find(x=>x.id===id);if(!e)return;const oldList=e.listId;e.date=$('#eDate').value;e.type=$('#eType').value;if(e.type==='work'){const short=$('#eWorkKind')?.value==='short';e.title=short?'時短バイト':'バイト';e.time='22:00';e.end=short?'03:00':'06:00'}else{e.title=$('#eTitle').value.trim();if(!e.title)return;e.time=$('#eTime').value}e.important=!!$('#eImportant')?.checked;e.listId=$('#eList').value||null;if(oldList!==e.listId)e.packState={};save();showDay(e.date)}

function saveQuickTodo(){const t=$('#qTitle').value.trim();if(!t)return;data.todos.push({id:uid(),title:t,date:$('#qDate').value,done:false});save();closeSheet()} function saveQuickEvent(){const t=$('#eTitle').value.trim();if(!t)return;data.events.push({id:uid(),title:t,date:$('#eDate').value,time:$('#eTime').value,type:$('#eType').value,important:!!$('#eImportant')?.checked,listId:$('#eList').value||null,packState:{}});save();closeSheet()}

let deliveryView='waiting';
const deliveryPeriodLabels={early:'上旬',middle:'中旬',late:'下旬'};
function deliveryRange(d){
 const month=d.month||todayKey().slice(0,7);
 if(d.mode==='dates')return [d.start||month+'-01',d.end||d.start||month+'-01'];
 const [y,m]=month.split('-').map(Number),last=new Date(y,m,0).getDate();
 const segments={early:[1,10],middle:[11,20],late:[21,last]};
 const a=segments[d.fromPeriod||'early'],b=segments[d.toPeriod||d.fromPeriod||'early'];
 return [month+'-'+pad(a[0]),month+'-'+pad(b[1])];
}
function deliveryLabel(d){
 if(d.mode==='dates'){const a=d.start||'',b=d.end||a;return a===b?`${Number(a.slice(5,7))}月${Number(a.slice(8,10))}日`:`${Number(a.slice(5,7))}月${Number(a.slice(8,10))}日 〜 ${Number(b.slice(5,7))}月${Number(b.slice(8,10))}日`;}
 const m=d.month||todayKey().slice(0,7),a=d.fromPeriod||'early',b=d.toPeriod||a;
 return `${Number(m.slice(0,4))}年${Number(m.slice(5,7))}月 ${deliveryPeriodLabels[a]}${a===b?'':'〜'+deliveryPeriodLabels[b]}`;
}
function renderDeliveries(){
 const root=$('#deliveriesPage');if(!root)return;
 const items=(data.deliveries||[]).filter(d=>deliveryView==='arrived'?d.arrived:!d.arrived).sort((a,b)=>deliveryRange(a)[0].localeCompare(deliveryRange(b)[0]));
 root.innerHTML=`<div class="delivery-top"><div><div class="delivery-kicker">MY PARCELS</div><div class="delivery-title">届くもの <span>📦</span></div><div class="small muted">買ったものと、届く予定をひとまとめ。</div></div><button class="btn primary" onclick="openDeliveryEditor()">＋ 追加</button></div>
 <div class="tabs"><button class="${deliveryView==='waiting'?'active':''}" onclick="deliveryView='waiting';renderDeliveries()">届く予定 (${data.deliveries.filter(d=>!d.arrived).length})</button><button class="${deliveryView==='arrived'?'active':''}" onclick="deliveryView='arrived';renderDeliveries()">届いた (${data.deliveries.filter(d=>d.arrived).length})</button></div>
 <div class="delivery-items">${items.length?items.map(d=>`<div class="delivery-card"><div class="delivery-card-top"><span class="delivery-date">✧ ${esc(deliveryLabel(d))}</span><button class="delivery-edit" onclick="openDeliveryEditor('${d.id}')">✎</button></div><div class="delivery-name">${esc(d.name)}</div>${d.shop?`<div class="small muted">${esc(d.shop)}</div>`:''}${d.note?`<div class="delivery-note">${esc(d.note)}</div>`:''}<div class="delivery-foot"><button class="btn ghost" onclick="toggleDelivery('${d.id}')">${d.arrived?'↩ 未着に戻す':'✓ 届いた！'}</button></div></div>`).join(''):`<div class="delivery-empty">${deliveryView==='waiting'?'まだ登録なし。届くものを追加してね。':'受け取り済みはここにまとまるよ。'}</div>`}</div>`;
}
function deliveryModeChange(){
 const mode=$('#deliveryMode')?.value;
 $('#deliveryDates').style.display=mode==='dates'?'block':'none';
 $('#deliveryPeriods').style.display=mode==='period'?'block':'none';
}
function openDeliveryEditor(id=''){
 const d=(data.deliveries||[]).find(x=>x.id===id)||{name:'',shop:'',note:'',mode:'period',month:todayKey().slice(0,7),fromPeriod:'early',toPeriod:'early',start:todayKey(),end:todayKey()};
 const periodOpts=Object.entries(deliveryPeriodLabels).map(([v,t])=>`<option value="${v}">${t}</option>`).join('');
 openSheet(`<h3>${id?'届くものを編集':'届くものを追加'}</h3>
 <div class="label">買ったもの</div><input class="input" id="deliveryName" value="${attr(d.name)}" placeholder="例：ネイルパーツ">
 <div class="label" style="margin-top:10px">購入先（任意）</div><input class="input" id="deliveryShop" value="${attr(d.shop)}" placeholder="例：通販サイト">
 <div class="label" style="margin-top:12px">お届け予定の指定方法</div><select id="deliveryMode" onchange="deliveryModeChange()"><option value="period" ${d.mode!=='dates'?'selected':''}>上旬・中旬・下旬で指定</option><option value="dates" ${d.mode==='dates'?'selected':''}>日付・日付の範囲で指定</option></select>
 <div id="deliveryPeriods"><div class="label" style="margin-top:12px">お届け予定の月</div><input class="input" id="deliveryMonth" type="month" value="${attr(d.month||todayKey().slice(0,7))}"><div class="delivery-input-row"><div><div class="label">いつから</div><select id="deliveryFrom">${periodOpts}</select></div><div><div class="label">いつまで</div><select id="deliveryTo">${periodOpts}</select></div></div><div class="tiny muted">例：上旬〜中旬、下旬のみ</div></div>
 <div id="deliveryDates"><div class="delivery-input-row"><div><div class="label">何月何日から</div><input class="input" id="deliveryStart" type="date" value="${attr(d.start||todayKey())}"></div><div><div class="label">何月何日まで</div><input class="input" id="deliveryEnd" type="date" value="${attr(d.end||d.start||todayKey())}"></div></div><div class="tiny muted">1日だけなら同じ日を指定してね。</div></div>
 <div class="label" style="margin-top:12px">メモ（任意）</div><textarea id="deliveryNote" rows="2" class="input" placeholder="色、注文番号など">${esc(d.note)}</textarea>
 <div class="sheet-actions">${id?`<button class="btn ghost" style="color:#ba667f" onclick="deleteDelivery('${id}')">削除</button>`:''}<button class="btn ghost" onclick="closeSheet()">閉じる</button><button class="btn primary" onclick="saveDelivery('${id}')">保存</button></div>`);
 $('#deliveryFrom').value=d.fromPeriod||'early';$('#deliveryTo').value=d.toPeriod||d.fromPeriod||'early';deliveryModeChange();
}
function saveDelivery(id){
 const name=$('#deliveryName').value.trim(),mode=$('#deliveryMode').value;
 if(!name){alert('買ったものの名前を入れてね');return;}
 const d={name,shop:$('#deliveryShop').value.trim(),note:$('#deliveryNote').value.trim(),mode,month:$('#deliveryMonth').value,fromPeriod:$('#deliveryFrom').value,toPeriod:$('#deliveryTo').value,start:$('#deliveryStart').value,end:$('#deliveryEnd').value};
 if(mode==='period'&&['early','middle','late'].indexOf(d.fromPeriod)>['early','middle','late'].indexOf(d.toPeriod)){alert('「いつまで」を「いつから」以降にしてね');return;}
 if(mode==='dates'&&(!d.start||!d.end||d.start>d.end)){alert('お届け予定の日付を確認してね');return;}
 const old=data.deliveries.find(x=>x.id===id);
 if(old)Object.assign(old,d);else data.deliveries.push({...d,id:uid(),arrived:false});
 closeSheet();save();
}
function toggleDelivery(id){const d=data.deliveries.find(x=>x.id===id);if(!d)return;d.arrived=!d.arrived;save()}
function deleteDelivery(id){if(!confirm('この届くものを削除する？'))return;data.deliveries=data.deliveries.filter(x=>x.id!==id);closeSheet();save()}
function renderAll(){const pages=[renderMore,renderHome,renderCalendar,renderLists,renderPrep,renderDiet,renderDiary,renderWork,renderCycles,renderDeliveries];for(const fn of pages){try{fn()}catch(e){console.error("R1ne-os render error:",fn.name,e);if(fn===renderDiet){const root=document.getElementById("dietPage");if(root)root.innerHTML=`<div class="pink-shell"><div class="diet-card"><h3>表示エラー</h3><p>記録は削除していないよ。画面の表示に問題が発生しました。</p><p class="small muted">${esc(e.message||"不明なエラー")}</p></div></div>`}}}}
Object.assign(window,{go,goBack,toggleHomeSection,togglePeriodStart,toggleTodo,toggleEventPack,guessEventList,toggleWorkEditChoice,deleteEvent,saveHomeDiary,openWish,previewWishImage,saveWish,deleteWish,openJournalEntry,saveJournalEntry,openEditMemo,saveEditMemo,setDiaryTag,calMove,showDay,setListFilter,openList,openListEditor,toggleListItem,editListItem,deleteListItem,addListItem,resetList,duplicateList,deleteList,openNewList,createList,toggleUniformAtHome,toggleWorkBagCheck,toggleWorkBagItem,addWorkBagItem,editWorkBagItem,deleteWorkBagItem,moveWorkBagItem,toggleListEdit,moveListItem,prepNext,prepBack,prepReset,changePrepTemplate,togglePrepStopwatch,openPrepStats,resetPrepStat,openPrepSettings,openNewPrepTemplate,createPrepTemplate,movePrepStep,prepDragStart,prepDragOver,prepDrop,prepDragEnd,prepPointerStart,deletePrepStep,addPrepStep,savePrepSettings,openWeight,saveWeight,openMeal,saveMeal,openGoal,saveGoal,renderDiary,openBulkShift,saveBulkShift,cycleDone,openCycle,saveCycle,openQuickAdd,saveQuickTodo,saveQuickEvent,closeSheet,exportData,importData,installPWA});renderAll();

<script>
(function(){
 const m=[["日記","renderDiary"],["交換周期","renderCycles"],["持ち物","renderLists"],["リスト","renderLists"],["バイト","renderWork"]];
 document.addEventListener("click",function(e){
  const x=e.target.closest("button,a,.row,.menu-item,[onclick]"); if(!x)return;
  const s=(x.textContent||"").trim();
  for(const [a,f] of m) if(s.includes(a)&&typeof window[f]==="function") setTimeout(()=>{try{window[f]()}catch(z){console.error(f,z)}},10);
 },true);

/* Standalone TODOs alongside existing shopping/packing lists */
let todoCompletedOpen=false,todoDragId=null,todoTouchStart=null;
function todoEntries(){data.todos=data.todos||[];return data.todos.filter(x=>x.rineStandalone)}
function renderLists(){
 const cats=['すべて','やること','買い物','持ち物'];
 const lists=data.lists.filter(l=>listFilter==='すべて'||l.cat===listFilter);
 const tasks=todoEntries(),active=tasks.filter(x=>!x.done),completed=tasks.filter(x=>x.done);
 const taskRow=x=>`<div class="rine-todo-row ${x.done?'is-done':''}" data-todo-id="${x.id}" draggable="true" ondragstart="todoDragStart(event,'${x.id}')" ondragover="event.preventDefault()" ondrop="todoDrop(event,'${x.id}')"><span class="rine-drag" aria-label="並べ替え">⠿</span><button class="rine-circle ${x.done?'checked':''}" onclick="toggleTodo('${x.id}')">${x.done?'✓':''}</button><span class="rine-todo-text" onclick="editStandaloneTodo('${x.id}')">${esc(x.title)}</span><button class="rine-todo-edit" onclick="editStandaloneTodo('${x.id}')">✎</button></div>`;
 $('#listsPage').innerHTML=`<div class="tabs">${cats.map(c=>`<button class="${c===listFilter?'active':''}" onclick="setListFilter('${c}')">${c}</button>`).join('')}</div><div style="height:10px"></div>${listFilter==='すべて'||listFilter==='やること'?`<section class="rine-todos"><div class="between"><h3>やること</h3><button class="pill" onclick="openStandaloneTodo()">＋</button></div><div id="rineTodoActive">${active.map(taskRow).join('')||'<div class="tiny muted" style="padding:12px">やることはまだないよ</div>'}</div><details class="rine-completed" ${todoCompletedOpen?'open':''} ontoggle="todoCompletedOpen=this.open"><summary>完了済み (${completed.length})</summary>${completed.map(taskRow).join('')||'<div class="tiny">まだありません</div>'}</details></section>`:''}${lists.map(l=>{const done=l.items.filter(i=>i.done).length,p=l.items.length?done/l.items.length*100:0;return `<div class="list-card" onclick="openList('${l.id}')"><div class="between"><div><b>${esc(l.name)}</b><div class="tiny muted">${l.cat} ・ ${done}/${l.items.length}</div></div><span>›</span></div><div class="progress"><span style="width:${p}%"></span></div></div>`}).join('')}<button class="btn primary" style="width:100%" onclick="openNewList()">＋新しいリスト</button>`;
 const container=$('#rineTodoActive');
 if(container){container.addEventListener('touchstart',todoTouchBegin,{passive:true});container.addEventListener('touchend',todoTouchEnd,{passive:true})}
}
function openStandaloneTodo(id){const x=data.todos.find(t=>t.id===id);openSheet(`<h3>${x?'やることを編集':'やることを追加'}</h3><input id="standaloneTodoText" class="input" placeholder="例：役所に行く" value="${attr(x?.title||'')}"><div class="sheet-actions">${x?`<button class="btn ghost" onclick="deleteStandaloneTodo('${id}')">削除</button>`:''}<button class="btn ghost" onclick="closeSheet()">閉じる</button><button class="btn primary" onclick="saveStandaloneTodo('${id||''}')">保存</button></div>`)}
function editStandaloneTodo(id){openStandaloneTodo(id)}
function saveStandaloneTodo(id){const v=$('#standaloneTodoText')?.value.trim();if(!v)return;const x=data.todos.find(t=>t.id===id);if(x){x.title=v}else data.todos.push({id:uid(),title:v,date:'',done:false,rineStandalone:true});closeSheet();save()}
function deleteStandaloneTodo(id){data.todos=data.todos.filter(t=>t.id!==id);closeSheet();save()}
function todoDragStart(e,id){todoDragId=id;if(e.dataTransfer)e.dataTransfer.effectAllowed='move'}
function todoReorder(from,to){const a=data.todos,i=a.findIndex(x=>x.id===from),j=a.findIndex(x=>x.id===to);if(i<0||j<0||i===j)return;const [item]=a.splice(i,1);a.splice(j,0,item);save()}
function todoDrop(e,id){e.preventDefault();if(todoDragId)todoReorder(todoDragId,id);todoDragId=null}
function todoTouchBegin(e){const grip=e.target.closest('.rine-drag');if(!grip)return;todoTouchStart=grip.closest('[data-todo-id]')?.dataset.todoId||null}
function todoTouchEnd(e){if(!todoTouchStart)return;const touch=e.changedTouches[0];const hit=document.elementFromPoint(touch.clientX,touch.clientY)?.closest('[data-todo-id]');if(hit)todoReorder(todoTouchStart,hit.dataset.todoId);todoTouchStart=null}

</script>
