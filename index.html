function nthWeekday(y,m,weekday,n){const d=new Date(y,m-1,1),offset=(7+weekday-d.getDay())%7;return 1+offset+7*(n-1)}
function jpHolidayBase(y,m,d){const k=`${m}-${d}`;if(['1-1','2-11','2-23','4-29','5-3','5-4','5-5','8-11','11-3','11-23'].includes(k))return true;if(m===1&&d===nthWeekday(y,1,1,2))return true;if(m===7&&d===nthWeekday(y,7,1,3))return true;if(m===9&&d===nthWeekday(y,9,1,3))return true;if(m===10&&d===nthWeekday(y,10,1,2))return true;const ve=Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4)),ae=Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4));if(m===3&&d===ve)return true;if(m===9&&d===ae)return true;return false}
function isJpHoliday(y,m,d){if(jpHolidayBase(y,m,d))return true;const cur=new Date(y,m-1,d);if(cur.getDay()!==0){let prev=new Date(cur);prev.setDate(prev.getDate()-1);while(prev.getDay()===0)prev.setDate(prev.getDate()-1);if(jpHolidayBase(prev.getFullYear(),prev.getMonth()+1,prev.getDate())){const base=new Date(prev);base.setDate(base.getDate()+1);while(base.getDay()===0)base.setDate(base.getDate()+1);if(base.toDateString()===cur.toDateString())return true}}const a=new Date(cur);a.setDate(a.getDate()-1);const b=new Date(cur);b.setDate(b.getDate()+1);if(a.getDay()!==0&&b.getDay()!==0&&jpHolidayBase(a.getFullYear(),a.getMonth()+1,a.getDate())&&jpHolidayBase(b.getFullYear(),b.getMonth()+1,b.getDate()))return true;return false}
let calCursor=new Date();calCursor.setDate(1);function renderCalendar(){const y=calCursor.getFullYear(),m=calCursor.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0);let cells='';for(let i=0;i<first.getDay();i++)cells+='<div class="daycell"></div>';for(let day=1;day<=last.getDate();day++){const k=`${y}-${pad(m+1)}-${pad(day)}`,es=eventsOn(k),d=diaryFor(k),hasDiary=(d.memos?.length||d.song||d.specialDay),wd=new Date(y,m,day).getDay(),holiday=isJpHoliday(y,m+1,day),dayClass=holiday?'holiday':wd===0?'sun':wd===6?'sat':'';cells+=`<div class="daycell ${dayClass} ${k===todayKey()?'today':''}" onclick="showDay('${k}')"><div class="daynum">${day}</div>${hasDiary?'<span class="cal-journal">✦</span>':''}${es.slice(0,3).map(e=>`<div class="cal-event ${e.type==='out'?'pink':e.type?.startsWith('trash')?'green':''} ${e.important?'important':''}">${e.important?'☆ ':''}${e.time?e.time+' ':''}${esc(e.title)}</div>`).join('')}${es.length>3?`<div class="cal-more">+${es.length-3}件</div>`:''}</div>`}$('#calendarPage').innerHTML=`<div class="card calendar-wrap"><div class="cal-head"><button class="btn ghost" onclick="calMove(-1)">‹</button><b>${y}年 ${m+1}月</b><button class="btn ghost" onclick="calMove(1)">›</button></div><div class="cal-grid">${'日月火水木金土'.split('').map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div><div class="tiny muted" style="margin-top:8px">✦ = 日記・一曲・「今日は何の日？」の記録あり</div></div>`}
function calMove(n){calCursor.setMonth(calCursor.getMonth()+n);renderCalendar()} function showDay(k){const es=eventsOn(k),d=diaryFor(k),ws=data.weights.filter(x=>x.date===k),ms=data.meals.filter(x=>x.date===k),hasRecord=!!(d.specialDay||d.song||d.memos?.length);openSheet(`<h3>${fmtDate(k)}</h3>${specialAutoHtml(k)}${d.specialDay?`<div class="special-day-badge"><div class="between"><b>☆ 今日は何の日？</b><button class="pill" onclick="openDayRecord('${k}')">✎</button></div>${esc(d.specialDay)}</div>`:''}${es.length?`<div class="label">予定</div>${es.map(e=>eventRow(e,true)).join('')}`:''}${d.song?`<div class="between" style="margin-top:12px"><div class="label" style="margin:0">この日の一曲</div><button class="pill" onclick="openDayRecord('${k}')">✎</button></div><div class="song-badge"><b>♪ ${esc(d.song.title)}</b> ${esc(d.song.artist||'')}</div>`:''}${d.memos?.length?`<div class="label" style="margin-top:12px">日記</div>${d.memos.map(m=>`<div class="journal-entry"><button class="pill journal-edit-float" onclick="openEditMemo('${k}','${m.id}')">✎</button>${m.time?`<div class="tiny muted journal-time">${m.time}</div>`:''}<div class="journal-body">${esc(m.text)}</div><div>${(m.tags||[]).map(t=>`<span class="tagchip pink">#${esc(t)}</span>`).join('')}</div></div>`).join('')}`:''}${ws.length?`<div class="label" style="margin-top:12px">体重</div>${ws.map(w=>`<div class="small">${w.time}　<b>${w.value}kg</b> ${esc(w.note||'')}</div>`).join('')}`:''}${ms.length?`<div class="label" style="margin-top:12px">食事</div>${ms.map(m=>`<div class="small">${m.time}　${esc(m.menu)} ${m.kcal?m.kcal+'kcal':''}</div>`).join('')}`:''}${!es.length&&!hasRecord&&!ws.length&&!ms.length?'<div class="muted small">この日はまだ何もなし。</div>':''}<div class="sheet-actions" style="margin-top:14px"><button class="btn ghost" onclick="closeSheet();openQuickAdd('event','${k}')">＋予定</button><button class="btn primary" onclick="openDayRecord('${k}')">${hasRecord?'✎ 記録を編集':'✦ 記録を追加'}</button></div>`) }

 function toggleListItem(lid,iid){const l=data.lists.find(x=>x.id===lid),i=l?.items.find(x=>x.id===iid);if(i)i.done=!i.done;save();openList(lid)} function addListItem(id){const t=$('#newItemText').value.trim();if(!t)return;data.lists.find(x=>x.id===id).items.push({id:uid(),text:t,done:false});save();openList(id)} function resetList(id){data.lists.find(x=>x.id===id).items.forEach(i=>i.done=false);save();openList(id)} function duplicateList(id){const l=data.lists.find(x=>x.id===id);data.lists.push({id:uid(),name:l.name+' コピー',cat:l.cat,items:l.items.map(i=>({id:uid(),text:i.text,done:false}))});save();closeSheet()} function deleteList(id){const l=data.lists.find(x=>x.id===id);if(!l||id==='workBag')return;if(!confirm(`「${l.name}」を削除する？`))return;data.lists=data.lists.filter(x=>x.id!==id);data.events.forEach(e=>{if(e.listId===id){e.listId=null;e.packState={}}});save();closeSheet()} function openNewList(){openSheet(`<h3>新しいリスト</h3><input id="listName" class="input" placeholder="リスト名"><div style="height:9px"></div><select id="listCat"><option>やること</option><option>買い物</option><option>持ち物</option></select><div class="sheet-actions"><button class="btn ghost" onclick="closeSheet()">やめる</button><button class="btn primary" onclick="createList()">作る</button></div>`)} function createList(){const n=$('#listName').value.trim();if(!n)return;data.lists.push({id:uid(),name:n,cat:$('#listCat').value,items:[]});save();closeSheet()}
function activePrep(){return data.prepTemplates.find(t=>t.id===data.prepState.templateId)||data.prepTemplates[0]}
let prepTimerStartedAt=null;
function prepStat(stepId){return data.prepStats?.[stepId]||null}
function formatDuration(ms){if(ms==null||!isFinite(ms))return'--';const sec=Math.max(0,Math.round(ms/1000));if(sec<60)return sec+'秒';const m=Math.floor(sec/60),s=sec%60;return s?`${m}分${s}秒`:`${m}分`}
function stepAvg(st){return st&&st.count?st.totalMs/st.count:null}
function prepStepStatsHtml(stepId){const st=prepStat(stepId);if(!st||!st.count)return'<span>まだ計測なし</span>';return `<span>実測 ${st.count}回　✦ 最短 ${formatDuration(st.minMs)}　♡ 平均 ${formatDuration(stepAvg(st))}　✧ 最長 ${formatDuration(st.maxMs)}</span>`}
function currentPrepElapsed(){return data.prepState.stopwatchEnabled&&prepTimerStartedAt?Date.now()-prepTimerStartedAt:0}
function formatStopwatch(ms){const total=Math.max(0,Math.floor(ms/1000)),m=Math.floor(total/60),sec=total%60;return `${pad(m)}:${pad(sec)}`}
function startPrepTimer(){prepTimerStartedAt=data.prepState.stopwatchEnabled?Date.now():null}
function recordPrepStep(step){if(!data.prepState.stopwatchEnabled||!prepTimerStartedAt||!step)return;const ms=Date.now()-prepTimerStartedAt;if(ms<500)return;data.prepStats=data.prepStats||{};const st=data.prepStats[step.id]||{count:0,totalMs:0,minMs:null,maxMs:null,lastMs:null};st.count+=1;st.totalMs+=ms;st.minMs=st.minMs==null?ms:Math.min(st.minMs,ms);st.maxMs=st.maxMs==null?ms:Math.max(st.maxMs,ms);st.lastMs=ms;data.prepStats[step.id]=st}
function togglePrepStopwatch(on){data.prepState.stopwatchEnabled=!!on;prepTimerStartedAt=on?Date.now():null;localStorage.setItem(LS,JSON.stringify(data));renderPrep()}
function prepTotals(){const tpl=activePrep(),stats=tpl.steps.map(s=>prepStat(s.id)).filter(st=>st&&st.count);return {measured:stats.length,total:tpl.steps.length,min:stats.reduce((a,st)=>a+(st.minMs||0),0),avg:stats.reduce((a,st)=>a+(stepAvg(st)||0),0),max:stats.reduce((a,st)=>a+(st.maxMs||0),0)}}
function subtractMsFromTime(hhmm,ms){if(!hhmm)return'--:--';const [h,m]=hhmm.split(':').map(Number),d=new Date(2000,0,1,h,m);d.setMilliseconds(d.getMilliseconds()-ms);return `${pad(d.getHours())}:${pad(d.getMinutes())}`}
function renderPrep(){const tpl=activePrep();data.prepState.index=Math.max(0,Math.min(data.prepState.index,tpl.steps.length-1));const i=data.prepState.index,s=tpl.steps[i],n=tpl.steps[i+1],sw=!!data.prepState.stopwatchEnabled,tot=prepTotals();if(sw&&!prepTimerStartedAt)prepTimerStartedAt=Date.now();$('#prepPage').innerHTML=`<div class="prep-page"><div class="between"><select style="width:auto;border:0;background:transparent;font-weight:850" onchange="changePrepTemplate(this.value)">${data.prepTemplates.map(t=>`<option value="${t.id}" ${t.id===tpl.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select><div style="display:flex;gap:6px"><button class="pill pink" onclick="openPrepStats()">⏱ 記録</button><button class="pill pink" onclick="openPrepSettings()">工程編集</button></div></div><div class="prep-clock" id="prepClock">${timeNow()}</div><div class="prep-meta">出発目安 ${tpl.leave||'--:--'}　・　STEP ${i+1}/${tpl.steps.length}</div><div class="prep-now"><div class="prep-label">今やること</div><div class="prep-task">${esc(s?.text||'完了')}</div>${s?.target?`<div class="prep-target">目安 ${s.target} まで</div>`:''}<div class="stopwatch-panel"><div class="stopwatch-top"><label class="stopwatch-toggle"><input type="checkbox" ${sw?'checked':''} onchange="togglePrepStopwatch(this.checked)">⏱ 計測する</label><div class="stopwatch-time" id="prepStopwatch">${sw?formatStopwatch(currentPrepElapsed()):'--:--'}</div></div><div class="step-stats">${s?prepStepStatsHtml(s.id):''}</div></div><button class="big-tap" onclick="prepNext()">タップして完了</button><div class="prep-next">${n?'次：'+esc(n.text):'これで最後！'}</div><div class="prep-actions"><button class="btn ghost" onclick="prepBack()">↶ ひとつ戻る</button><button class="btn ghost" onclick="prepReset()">最初から</button></div></div>${tot.measured?`<div class="small muted" style="text-align:center;margin-top:12px">⏱ ${tot.measured}/${tot.total}工程 計測済み　・　平均合計 ${formatDuration(tot.avg)}</div>`:''}</div>`;setTimeout(updatePrepClock,60)}
function updatePrepClock(){const e=$('#prepClock');if(e)e.textContent=timeNow();const sw=$('#prepStopwatch');if(sw&&data.prepState.stopwatchEnabled)sw.textContent=formatStopwatch(currentPrepElapsed())}
setInterval(updatePrepClock,1000);
function prepNext(){const t=activePrep(),step=t.steps[data.prepState.index],isLast=data.prepState.index>=t.steps.length-1;recordPrepStep(step);if(isLast){data.prepState.stopwatchEnabled=false;prepTimerStartedAt=null}else{data.prepState.index+=1;prepTimerStartedAt=data.prepState.stopwatchEnabled?Date.now():null}save()}

function openPrepSettings(){const tpl=activePrep();openSheet(`<h3>${esc(tpl.name)} の工程</h3><div class="small muted" style="margin-bottom:10px">↑↓で並べ替え</div><div id="prepEditList">${tpl.steps.map((s,i)=>prepEditRow(s,i)).join('')}</div><div class="form-row"><input id="newStepText" class="input" placeholder="新しい工程"><input id="newStepTime" class="input" type="time"></div><button class="btn ghost" style="width:100%" onclick="addPrepStep()">＋工程を追加</button><div style="height:10px"></div><div class="label">出発目安</div><input id="leaveTime" class="input" type="time" value="${tpl.leave||''}"><div class="sheet-actions"><button class="btn ghost" onclick="closeSheet()">閉じる</button><button class="btn pink" onclick="savePrepSettings()">保存</button></div>`)} function prepEditRow(s,i){return `<div class="step-edit"><div class="move-stack"><button onclick="movePrepStep(${i},-1)">↑</button><button onclick="movePrepStep(${i},1)">↓</button></div><input class="input" id="pst${i}" value="${attr(s.text)}"><input class="input" id="psu${i}" type="time" value="${attr(s.target||'')}"><button class="delete-step" onclick="deletePrepStep(${i})">削除</button></div>`} function syncPrepEdits(){const t=activePrep();t.steps.forEach((s,i)=>{const a=$(`#pst${i}`),b=$(`#psu${i}`);if(a)s.text=a.value;if(b)s.target=b.value})} function movePrepStep(i,dir){syncPrepEdits();const t=activePrep(),j=i+dir;if(j<0||j>=t.steps.length)return;[t.steps[i],t.steps[j]]=[t.steps[j],t.steps[i]];openPrepSettings()} function deletePrepStep(i){syncPrepEdits();activePrep().steps.splice(i,1);openPrepSettings()} function addPrepStep(){syncPrepEdits();const text=$('#newStepText').value.trim(),target=$('#newStepTime').value;if(!text)return;activePrep().steps.push({id:uid(),text,target});openPrepSettings()} function savePrepSettings(){syncPrepEdits();activePrep().leave=$('#leaveTime').value;data.prepState.index=Math.min(data.prepState.index,activePrep().steps.length-1);save();closeSheet()}

function weightFor(k){const a=data.weights.filter(w=>w.date===k);return a.length?Math.min(...a.map(w=>Number(w.value))):null} function renderDiet(){const g=data.dietGoal,t=todayKey(),tw=weightFor(t),latest=[...data.weights].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time))[0],cur=tw??(latest?Number(latest.value):g.startWeight),remain=(cur-g.targetWeight).toFixed(1),pts=[];for(let i=6;i>=0;i--){const k=addDays(t,-i);pts.push({k,v:weightFor(k)})} const vals=pts.map(p=>p.v).filter(v=>v!=null),min=Math.min(g.targetWeight,...vals,g.startWeight)-1,max=Math.max(g.startWeight,...vals)+1,xy=(v,i)=>[12+i*(276/6),148-((v-min)/(max-min||1))*120],poly=pts.map((p,i)=>p.v==null?null:xy(p.v,i)).filter(Boolean).map(x=>x.join(',')).join(' '),goalLine=pts.map((p,i)=>{const total=(new Date(g.targetDate)-new Date(g.startDate))/86400000||1,passed=(new Date(p.k)-new Date(g.startDate))/86400000;return xy(g.startWeight+(g.targetWeight-g.startWeight)*(passed/total),i).join(',')}).join(' '),todayMeals=data.meals.filter(m=>m.date===t),kcal=todayMeals.reduce((a,m)=>a+Number(m.kcal||0),0);$('#dietPage').innerHTML=`<div class="pink-shell"><div class="diet-card"><div class="between"><h3 class="section-title">体重の推移</h3><button class="pill pink" onclick="openGoal()">目標設定</button></div><div class="chart"><svg viewBox="0 0 300 160"><polyline points="${goalLine}" fill="none" stroke="#f0a4cb" stroke-width="2" stroke-dasharray="5 5"/><polyline points="${poly}" fill="none" stroke="#ff5eae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((p,i)=>p.v==null?'':(()=>{const [x,y]=xy(p.v,i);return `<circle cx="${x}" cy="${y}" r="4" fill="#ff5eae"/>`})()).join('')}</svg></div><div class="legend">● 実測値　- - 目安ライン（各日の軽い方）</div></div><div class="metric-grid"><div class="metric">現在<b>${cur.toFixed(1)}kg</b></div><div class="metric">目標まで<b>${remain}kg</b></div><div class="metric">目標<b>${g.targetWeight}kg</b></div></div><div class="diet-card" style="margin-top:12px"><div class="between t g=data.dietGoal;openSheet(`<h3>目標設定</h3><div class="form-row"><div><div class="label">開始体重</div><input id="gStart" class="input" type="number" step="0.1" value="${g.startWeight}"></div><div><div class="label">目標体重</div><input id="gTarget" class="input" type="number" step="0.1" value="${g.targetWeight}"></div></div><div class="form-row"><input id="gStartDate" class="input" type="date" value="${g.startDate}"><input id="gTargetDate" class="input" type="date" value="${g.targetDate}"></div><div class="sheet-actions"><button class="btn ghost" onclick="closeSheet()">やめる</button><button class="btn pink" onclick="saveGoal()">保存</button></div>`)} function saveGoal(){data.dietGoal={startWeight:Number($('#gStart').value),targetWeight:Number($('#gTarget').value),startDate:$('#gStartDate').value,targetDate:$('#gTargetDate').value};save();closeSheet()}
let diaryTagFilter='';function setDiaryTag(v){diaryTagFilter=v;renderDiary()} function allDiaryTags(){return [...new Set(Object.values(data.diary).flatMap(d=>(d.memos||[]).flatMap(m=>m.tags||[])))].sort()} function renderDiary(){const dates=Object.keys(data.diary).filter(k=>{const d=diaryFor(k);return d.specialDay||d.song||d.memos?.length}).sort().reverse(),q=diaryTagFilter;$('#diaryPage').innerHTML=`<div class="card blue spark"><div class="between"><h3 class="section-title">日付から記録</h3><button class="pill" onclick="openDateRecordPicker()">＋過去の日</button></div><div class="small muted">過去の日も記録できます。</div></div><div class="card blue"><div class="between"><h3 class="section-title">日記を絞り込む</h3><button class="pill" onclick="setDiaryTag('')">解除</button></div><div>${allDiaryTags().map(t=>`<button class="tagchip ${q===t?'active':''}" onclick="setDiaryTag('${attr(t)}')">#${esc(t)}</button>`).join('')||'<span class="muted small">タグなし</span>'}</div></div>${dates.map(k=>{const d=diaryFor(k),memos=(d.memos||[]).filter(m=>!q||(m.tags||[]).includes(q));if(q&&!memos.length)return'';return `<div class="diary-list-day"><div class="between"><div class="diary-date">${fmtDate(k)}</div><button class="pill" onclick="openDayRecord('${k}')">編集</button></div>${d.specialDay&&!q?`<div class="special-day-badge"><b>☆ 今日は何の日？</b><br>${esc(d.specialDay)}</div>`:''}${d.song&&!q?`<div class="song-badge"><b>♪ ${esc(d.song.title)}</b>　${esc(d.song.artist||'')}</div>`:''}${memos.map(m=>`<div class="journal-entry"><button class="pill journal-edit-float" onclick="openEditMemo('${k}','${m.id}')">✎</button>${m.time?`<div class="tiny muted journal-time">${m.time}</div>`:''}<div class="journal-body">${esc(m.text)}</div><div>${(m.tags||[]).map(t=>`<button class="tagchip pink" onclick="setDiaryTag('${attr(t)}')">#${esc(t)}</button>`).join('')}</div></div>`).join('')}</div>`}).join('')||'<div class="muted small">まだ記録なし。</div>'}`}
